# Dependabot version-update PRs for the marketing site.
# Security *alerts* are enabled in repo settings; this drives scheduled bumps.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # astro is exact-pinned in package.json. Bump deliberately (the vite
      # override must track astro's vite peer), never via an automated PR.
      - dependency-name: "astro"
      # wrangler (deploy tool, exact-pinned devDependency) releases almost
      # daily; bump it by hand alongside releases. Dependabot alerts and the
      # weekly npm audit still flag advisories in its tree.
      - dependency-name: "wrangler"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
